services:
  - type: web
    name: deposita-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python -m app.start
    healthCheckPath: /health
    envVars:
      - key: DEPOSITA_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./deposita_demo.db
      - key: CORS_ORIGINS
        sync: false
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_USERNAME
        value: demo

  - type: web
    name: deposita-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
